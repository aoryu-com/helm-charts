{{- if not .Values.secret.existingSecret }}
{{- if or (not .Values.secret.apiKey) (not .Values.secret.dashboardPassword) (not .Values.secret.swaggerPassword) }}
{{- fail "secret.apiKey, secret.dashboardPassword and secret.swaggerPassword must be set explicitly (e.g. via --set or a values override) unless secret.existingSecret is used. Generate strong values with: uuidgen | tr -d '-'" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "waha.secretName" . }}
  labels:
    {{- include "waha.labels" . | nindent 4 }}
type: Opaque
stringData:
  WAHA_API_KEY: {{ .Values.secret.apiKey | quote }}
  WAHA_DASHBOARD_USERNAME: {{ .Values.secret.dashboardUsername | quote }}
  WAHA_DASHBOARD_PASSWORD: {{ .Values.secret.dashboardPassword | quote }}
  WHATSAPP_SWAGGER_USERNAME: {{ .Values.secret.swaggerUsername | quote }}
  WHATSAPP_SWAGGER_PASSWORD: {{ .Values.secret.swaggerPassword | quote }}
{{- end }}
